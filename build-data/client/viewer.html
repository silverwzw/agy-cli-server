<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{FILENAME}} - Web Terminal Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }
    .header {
      width: 100%;
      max-width: 1400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nav-links a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
      margin-left: 10px;
      padding: 5px 10px;
      border-radius: 4px;
      background: #1e293b;
      transition: background 0.2s, color 0.2s;
    }
    .nav-links a:hover {
      background: #334155;
      color: #f8fafc;
    }
    .viewer-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      width: 100%;
      max-width: 1400px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #182234;
      border-bottom: 1px solid #334155;
      flex-wrap: wrap;
      gap: 10px;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      overflow: hidden;
    }
    .file-path-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      color: #7dd3fc;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 4px 8px;
      border-radius: 4px;
      word-break: break-all;
    }
    .badge {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 8px;
      border-radius: 4px;
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .badge-highlight {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      font-weight: 600;
    }
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-tool {
      background: #0f172a;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-tool:hover {
      background: #334155;
      color: #f8fafc;
      border-color: #475569;
    }
    .btn-tool.copied {
      background: #065f46;
      border-color: #059669;
      color: #6ee7b7;
    }
    .code-wrapper {
      position: relative;
      overflow-x: auto;
      background: #0f172a;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
    }
    .code-lines {
      display: inline-block;
      min-width: 100%;
      padding: 8px 0;
    }
    .line-row {
      display: flex;
      min-height: 1.5rem;
      border-left: 3px solid transparent;
      scroll-margin-top: 80px;
    }
    .line-row:hover {
      background-color: rgba(255, 255, 255, 0.03);
    }
    .line-row.highlighted {
      background-color: rgba(56, 189, 248, 0.18);
      border-left-color: #38bdf8;
    }
    .line-row.highlighted .line-num {
      color: #38bdf8;
      font-weight: 600;
    }
    .line-num {
      flex-shrink: 0;
      width: var(--gutter-width, 54px);
      padding: 0 16px 0 12px;
      text-align: right;
      color: #64748b;
      user-select: none;
      text-decoration: none;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }
    .line-num:hover {
      color: #cbd5e1;
    }
    .line-content {
      flex: 1;
      white-space: pre;
      tab-size: 4;
      padding-right: 20px;
      color: #e2e8f0;
    }
    .wrap-lines .line-content {
      white-space: pre-wrap;
      word-break: break-all;
    }
    .loading-row,
    .empty-file-row,
    .error-row {
      padding: 32px 16px;
      text-align: center;
      color: #64748b;
      font-style: italic;
    }
    .error-row {
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>📄</span>
      <span>{{FILENAME}}</span>
    </div>
    <div class="nav-links">
      <a href="/a">Terminal (agy)</a>
      <a href="/s">Shell (bash)</a>
      <a href="/control/upload">Upload</a>
      <a href="{{DOWNLOAD_URL}}">Download</a>
    </div>
  </div>

  <div class="viewer-card">
    <div class="toolbar">
      <div class="toolbar-left">
        <span class="file-path-badge">{{DISPLAY_PATH}}</span>
        <span id="badge-lines" class="badge">Loading...</span>
        <span class="badge">{{FORMATTED_SIZE}}</span>
        <span class="badge">{{MODE_OCTAL}}</span>
        <span id="line-indicator" class="badge badge-highlight" style="display: none;"></span>
      </div>
      <div class="toolbar-right">
        <button id="btn-copy-path" class="btn-tool" data-path="{{DISPLAY_PATH}}">📋 Copy Path</button>
        <button id="btn-copy-content" class="btn-tool">📄 Copy Content</button>
        <button id="btn-toggle-wrap" class="btn-tool">Wrap Lines</button>
        <a href="{{DOWNLOAD_URL}}" class="btn-tool" id="btn-download">Download</a>
      </div>
    </div>

    <div class="code-wrapper" id="code-wrapper" data-download-url="{{DOWNLOAD_URL}}" style="--gutter-width: 48px;">
      <div class="code-lines" id="code-lines">
        <div class="loading-row"><span class="loading-text">Loading file content...</span></div>
      </div>
    </div>
  </div>

  <script defer src="/static/viewer.js"></script>
</body>
</html>
