<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Upload - Web Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .header {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-links a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
      margin-left: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      background: #1e293b;
      transition: background 0.2s;
    }
    .nav-links a:hover {
      background: #334155;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      width: 100%;
      max-width: 640px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .form-group input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-family: monospace;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input[type="text"]:focus {
      border-color: #38bdf8;
    }
    .form-hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 6px;
    }
    .drop-zone {
      border: 2px dashed #475569;
      border-radius: 8px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      background: #0f172a;
      transition: all 0.2s ease;
      margin-bottom: 20px;
    }
    .drop-zone.dragover {
      border-color: #38bdf8;
      background: #1e293b;
    }
    .drop-zone-icon {
      font-size: 36px;
      margin-bottom: 8px;
      color: #94a3b8;
    }
    .drop-zone-text {
      font-size: 14px;
      color: #cbd5e1;
    }
    .drop-zone-subtext {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }
    .file-info {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 20px;
      display: none;
    }
    .file-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
      font-size: 13px;
    }
    .summary-sep {
      color: #475569;
      margin: 0 8px;
    }
    .file-info-label { color: #94a3b8; }
    .file-info-val { color: #f8fafc; font-family: monospace; }
    .btn-clear {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      font-size: 12px;
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-clear:hover:not(:disabled) {
      border-color: #ef4444;
      color: #fca5a5;
    }
    .btn-clear:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .file-list {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
    }
    .file-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
      flex: 1;
      margin-right: 12px;
    }
    .file-item-name {
      color: #f8fafc;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-item-sub {
      color: #94a3b8;
      font-size: 11px;
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-item-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .file-status-badge {
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .status-pending {
      background: #334155;
      color: #94a3b8;
    }
    .status-uploading {
      background: #0369a1;
      color: #38bdf8;
    }
    .status-success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #86efac;
    }
    .status-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
    .btn-remove {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 15px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      transition: color 0.15s;
    }
    .btn-remove:hover {
      color: #ef4444;
    }
    .btn-rename {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      font-size: 11px;
      border-radius: 4px;
      padding: 2px 6px;
      cursor: pointer;
      line-height: 1.2;
      transition: all 0.15s ease;
    }
    .btn-rename:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .rename-container {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      margin: 2px 0;
    }
    .input-rename {
      flex: 1;
      padding: 3px 6px;
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 4px;
      color: #f8fafc;
      font-family: monospace;
      font-size: 12px;
      outline: none;
      min-width: 120px;
    }
    .btn-save-rename {
      background: #0284c7;
      border: none;
      color: #ffffff;
      font-size: 11px;
      font-weight: 500;
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
      line-height: 1.2;
      transition: background 0.15s ease;
    }
    .btn-save-rename:hover {
      background: #0369a1;
    }
    .btn-cancel-rename {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      font-size: 11px;
      border-radius: 4px;
      padding: 2px 6px;
      cursor: pointer;
      line-height: 1.2;
      transition: all 0.15s ease;
    }
    .btn-cancel-rename:hover {
      color: #e2e8f0;
      border-color: #64748b;
    }
    .original-name {
      font-size: 11px;
      color: #64748b;
      font-weight: normal;
      margin-left: 4px;
    }
    .btn-upload {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-upload:hover:not(:disabled) {
      background: #0369a1;
    }
    .btn-upload:disabled {
      background: #475569;
      cursor: not-allowed;
      opacity: 0.6;
    }
    .progress-container {
      margin-top: 20px;
      display: none;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
      color: #94a3b8;
    }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #0f172a;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      transition: width 0.1s ease;
    }
    .result-box {
      margin-top: 20px;
      padding: 14px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .result-box.success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #86efac;
    }
    .result-box.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">📁 File Upload</div>
    <div class="nav-links">
      <a href="/a">Terminal (agy)</a>
      <a href="/s">Shell (bash)</a>
    </div>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="dest-path">Target Directory</label>
      <input type="text" id="dest-path" value="/agy" placeholder="/agy or /agy/subfolder" />
      <div class="form-hint">Destination directory where files will be uploaded.</div>
    </div>

    <div class="form-group" style="margin-top: -8px; margin-bottom: 18px;">
      <label style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: #cbd5e1; font-size: 13px; font-weight: normal; user-select: none;">
        <input type="checkbox" id="check-overwrite" style="cursor: pointer; width: 16px; height: 16px; accent-color: #0284c7;" />
        <span>Replace existing files</span>
      </label>
    </div>

    <input type="file" id="file-input" multiple style="display: none;" />

    <div class="drop-zone" id="drop-zone">
      <div class="drop-zone-icon">⇪</div>
      <div class="drop-zone-text">Click to select files, or drag & drop files / folders here</div>
      <div class="drop-zone-subtext">Supports multi-file selection, folder drag & drop, & HTTP PUT streaming</div>
    </div>

    <div class="file-info" id="file-info">
      <div class="file-summary">
        <div>
          <span class="file-info-label">Selected: </span>
          <span class="file-info-val" id="summary-count">0 files</span>
          <span class="summary-sep">|</span>
          <span class="file-info-label">Total Size: </span>
          <span class="file-info-val" id="summary-size">0 B</span>
        </div>
        <button type="button" class="btn-clear" id="btn-clear">Clear all</button>
      </div>
      <div class="file-list" id="file-list"></div>
    </div>

    <button type="button" class="btn-upload" id="btn-upload" disabled>Upload Files</button>

    <div class="progress-container" id="progress-container">
      <div class="progress-header">
        <span id="progress-status">Uploading...</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </div>

    <div class="result-box" id="result-box"></div>
  </div>
  <script defer src="/static/upload.js"></script>
</body>
</html>
